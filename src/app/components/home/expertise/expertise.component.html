<section class="section expertise" id="expertise">
  <div class="container">
    <div class="section-box">
      <div class="about-title mb-5" data-aos="fade-up">
        <h3 class="section-title">
          <span class="n-section-title">03.</span> {{ 'Expertise.Title' | translate }}
        </h3>
      </div>
      <div class="expertise-grid">
        <div
          *ngFor="let group of 'Expertise.Groups' | translate; let i = index"
          class="expertise-card"
          data-aos="fade-up"
          [attr.data-aos-delay]="i * 60"
        >
          <h4 class="expertise-heading">{{ group.title }}</h4>
          <ul class="expertise-list">
            <li *ngFor="let item of group.items">{{ item }}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
